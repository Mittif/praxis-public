name: 功能建议
description: 描述一个实际使用场景及希望改善的体验
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 在什么情况下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望发生的变化
      description: 描述期望的行为、交互或数据处理方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有办法与补充信息
      description: 可以补充替代方案、相关场景或自编示例。
