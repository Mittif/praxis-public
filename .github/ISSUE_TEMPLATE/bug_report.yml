name: 问题反馈
description: 提交可复现的行为或界面问题
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        请使用演示题或自编数据复现。日志与截图中请隐去账号、密码、令牌和真实题库内容。
        安全漏洞请先查看仓库 SECURITY.md，避免在公开 Issue 披露细节。
  - type: dropdown
    id: interface
    attributes:
      label: 出现问题的位置
      options:
        - 主站
        - 简洁模式
        - API 或数据记录
        - 部署或题库工具
        - 文档
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本与环境
      description: Commit 或版本号、浏览器／系统、Docker 或本地开发方式
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 从哪个页面或命令开始，进行了哪些操作？
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息
      description: 可提供经过脱敏的日志或自编演示截图。
