name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend
      - name: Check source publication boundaries
        run: |
          python scripts/check_secrets.py
          python scripts/check_publication.py
          python scripts/check_docs.py
      - name: Generate original demonstration content
        run: python scripts/init_demo_bank.py
      - name: Test backend and shared presentation rules
        run: |
          python -m pytest -q
          npm run test:presentation --prefix frontend
      - name: Build both frontends
        run: npm run build --prefix frontend
      - name: Validate deployment scripts
        run: |
          bash -n deploy.sh scripts/migrate_compose.sh
          git diff --check
