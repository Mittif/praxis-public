  <!-- Seven independent panel paths. Colored offsets never duplicate the ink outline. -->
  <g transform="translate(10 15)" fill="#f38bde"><use href="#hero"/><use href="#note"/><use href="#banks"/><use href="#review"/></g>
  <g transform="translate(-12 13)" fill="#deffa2"><use href="#mobile"/><use href="#feedback"/><use href="#setup"/></g>
  <g fill="#fffdf4" stroke="#17171f" stroke-width="4" stroke-linejoin="miter">
    <use href="#hero"/><use href="#note"/><use href="#mobile"/><use href="#banks"/><use href="#feedback"/><use href="#setup"/><use href="#review"/>
  </g>

