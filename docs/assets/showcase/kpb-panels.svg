<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <title>Praxis · Kinetic Pop Brutalism 七格漫画底板</title>
  <desc>参考用户提供的漫画网格重绘。七个可独立编辑的矢量分镜，主描边统一为 4px。</desc>
