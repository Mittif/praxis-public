name: praxis

services:
  app:
    image: ${APP_IMAGE:-praxis-api:current}
    build: .
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql+psycopg://practice:${DB_PASSWORD:?configure DB_PASSWORD}@db/practice
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: practice
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: practice
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  web:
    image: ${WEB_IMAGE:-praxis-web:current}
    build: ./frontend
    ports: ["${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:80", "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-8443}:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    restart: unless-stopped
volumes:
  database:
  certificates:
